<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rank - HUNK 3D</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="./assets/title-screen-landscape.png" as="image" type="image/png" />
    <link rel="preload" href="./assets/load-screen-1.webp" as="image" type="image/webp" />
    <link rel="preload" href="./assets/load-screen-2.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="start-screen" id="startScreen" role="dialog" aria-modal="true" aria-labelledby="startTitle">
      <div class="start-frame">
        <div class="start-menu">
          <h1 class="start-title" id="startTitle" aria-label="The Rank">
            <span class="start-title__the">The</span>
            <span class="start-title__rank">Rank</span>
          </h1>
          <div class="start-actions">
            <button class="start-button" id="startButton" type="button">PRESS START</button>
            <button class="start-option-button" data-start-records-open type="button">Records</button>
            <button class="start-option-button" data-options-open="start" type="button">Options</button>
          </div>
        </div>
      </div>
      <div
        class="run-summary-modal start-records-modal"
        data-start-records-modal
        role="dialog"
        aria-modal="true"
        aria-labelledby="startRecordsTitle"
        hidden
      >
        <section class="run-summary-card" aria-label="Records">
          <h2 class="run-summary-title" id="startRecordsTitle">Records</h2>
          <div class="run-summary-body" data-start-records-body></div>
          <div class="run-summary-actions">
            <button class="run-summary-button run-summary-button--secondary" data-start-records-close type="button">Fechar</button>
          </div>
        </section>
      </div>
    </div>
    <div
      class="options-modal"
      data-options-modal
      role="dialog"
      aria-modal="true"
      aria-labelledby="optionsTitle"
      hidden
    >
      <section class="options-card" aria-label="Options">
        <h2 class="options-title" id="optionsTitle">Options</h2>
        <div class="options-fields">
          <label class="options-field" for="musicVolume">
            <span class="options-field__header">
              <span>Music</span>
              <output id="musicVolumeValue" data-music-volume-value for="musicVolume">100</output>
            </span>
            <input id="musicVolume" data-music-volume type="range" min="0" max="100" step="1" value="100" />
          </label>
          <label class="options-field" for="sfxVolume">
            <span class="options-field__header">
              <span>Ambient Sound</span>
              <output id="sfxVolumeValue" data-sfx-volume-value for="sfxVolume">100</output>
            </span>
            <input id="sfxVolume" data-sfx-volume type="range" min="0" max="100" step="1" value="100" />
          </label>
        </div>
        <div class="options-actions" data-options-game-actions hidden>
          <button class="options-button" data-options-restart type="button">Reiniciar</button>
          <button class="options-button options-button--secondary" data-options-exit type="button">Sair</button>
        </div>
        <button class="options-button options-button--close" data-options-close type="button">Fechar</button>
      </section>
    </div>
    <div class="dev-layout">
      <nav class="dev-tabs" role="tablist" aria-label="Paineis de ajustes">
        <button
          class="dev-tab"
          id="devTabMap"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="devPanelMap"
          data-dev-tab="map"
        >Mapa tiles</button>
        <button
          class="dev-tab"
          id="devTabCamera"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="devPanelCamera"
          data-dev-tab="camera"
          tabindex="-1"
        >Camera</button>
        <button
          class="dev-tab"
          id="devTabMovement"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="devPanelMovement"
          data-dev-tab="movement"
          tabindex="-1"
        >Movimento e arma</button>
        <button
          class="dev-tab"
          id="devTabColors"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="devPanelColors"
          data-dev-tab="colors"
          tabindex="-1"
        >Cores do Rank</button>
        <button
          class="dev-tab"
          id="devTabTuning"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="devPanelTuning"
          data-dev-tab="tuning"
          tabindex="-1"
        >Ajustes</button>
      </nav>
      <div class="dev-side-stack dev-side-stack--left">
        <aside
          class="dev-panel dev-panel--left tile-editor-panel dev-tab-panel"
          id="devPanelMap"
          role="tabpanel"
          aria-labelledby="devTabMap"
          data-dev-panel="map"
          aria-label="Editor top-down de tiles"
          hidden
        >
          <div class="panel-heading">
            <span>Mapa tiles</span>
            <small id="mapStatus" aria-live="polite">4 tiles</small>
          </div>
          <section class="tile-editor" aria-label="Mapa top-down">
            <div class="tile-editor-toolbar" aria-label="Controles do mapa">
              <button id="mapZoomOut" type="button" aria-label="Diminuir zoom">-</button>
              <button id="mapZoomReset" type="button">Fit</button>
              <button id="mapZoomIn" type="button" aria-label="Aumentar zoom">+</button>
              <button id="clearMapButton" type="button" aria-label="Limpar mapa">×</button>
              <button id="generateMapButton" type="button" aria-label="Gerar mapa">↻</button>
            </div>
            <div class="tile-editor-options" aria-label="Opcoes de construcao">
              <label class="toggle-row" for="showTileEdges">
                <span>Tile visivel</span>
                <span class="toggle-control">
                  <input id="showTileEdges" type="checkbox" checked />
                  <span class="toggle-track" aria-hidden="true"></span>
                  <span class="toggle-value" id="showTileEdgesValue">Sim</span>
                </span>
              </label>
              <label class="toggle-row" for="mapCovered">
                <span>Coberto</span>
                <span class="toggle-control">
                  <input id="mapCovered" type="checkbox" checked />
                  <span class="toggle-track" aria-hidden="true"></span>
                  <span class="toggle-value" id="mapCoveredValue">Sim</span>
                </span>
              </label>
              <div class="map-material-controls" aria-label="Materiais do mapa">
                <label class="material-field" for="floorMaterialSelect">
                  <span>Chao</span>
                  <span class="material-select-row">
                    <select id="floorMaterialSelect"></select>
                    <span class="material-preview" id="floorMaterialPreview" aria-hidden="true"></span>
                  </span>
                </label>
                <label class="material-field" for="wallMaterialSelect">
                  <span>Parede</span>
                  <span class="material-select-row">
                    <select id="wallMaterialSelect"></select>
                    <span class="material-preview" id="wallMaterialPreview" aria-hidden="true"></span>
                  </span>
                </label>
                <label class="material-field" for="ceilingMaterialSelect">
                  <span>Teto</span>
                  <span class="material-select-row">
                    <select id="ceilingMaterialSelect"></select>
                    <span class="material-preview" id="ceilingMaterialPreview" aria-hidden="true"></span>
                  </span>
                </label>
                <div class="material-preview-popover" id="materialPreviewPopover" aria-hidden="true">
                  <span class="material-preview-popover__image" id="materialPreviewPopoverImage"></span>
                  <span class="material-preview-popover__label" id="materialPreviewPopoverLabel"></span>
                </div>
              </div>
            </div>
            <div class="map-editor-main">
              <div class="floor-stack" id="floorStack" aria-label="Andares salvos"></div>
              <div class="map-scroll" id="mapViewport">
                <canvas
                  class="map-canvas"
                  id="mapCanvas"
                  width="512"
                  height="512"
                  aria-label="Editor de mapa 16 por 16"
                ></canvas>
              </div>
              <div class="map-tool-palette" aria-label="Ferramentas do mapa">
                <button class="map-tool-button is-active" type="button" data-map-tool="tile" aria-pressed="true" aria-label="Tile">
                  <span class="map-tool-icon map-tool-icon--tile" aria-hidden="true"></span>
                </button>
                <button class="map-tool-button" type="button" data-map-tool="enemy" aria-pressed="false" aria-label="Inimigo">
                  <span class="map-tool-icon map-tool-icon--enemy" aria-hidden="true"></span>
                </button>
                <button class="map-tool-button" type="button" data-map-tool="boss" aria-pressed="false" aria-label="Chefao">
                  <span class="map-tool-icon map-tool-icon--boss" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="map-editor-actions">
              <button id="applyMapButton" type="button">Aplicar</button>
              <button id="saveFloorButton" type="button">Salvar andar</button>
            </div>
            <p class="map-feedback" id="mapFeedback" aria-live="polite">Mapa aplicado</p>
          </section>
        </aside>

        <aside
          class="dev-panel dev-panel--left camera-panel dev-tab-panel"
          id="devPanelCamera"
          role="tabpanel"
          aria-labelledby="devTabCamera"
          data-dev-panel="camera"
          aria-label="Controle de camera"
          hidden
        >
          <div class="panel-heading">
            <span>Camera</span>
            <small id="cameraStatus" aria-live="polite">Ancorada</small>
          </div>
          <label class="toggle-row" for="freeCamera">
            <span>Camera livre</span>
            <span class="toggle-control">
              <input id="freeCamera" type="checkbox" />
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-value" id="freeCameraValue">Nao</span>
            </span>
          </label>
          <label class="toggle-row" for="cameraSideLeft">
            <span>Lado esquerdo</span>
            <span class="toggle-control">
              <input id="cameraSideLeft" type="checkbox" />
              <span class="toggle-track" aria-hidden="true"></span>
              <span class="toggle-value" id="cameraSideLeftValue">Nao</span>
            </span>
          </label>
          <label class="control-field range-field" for="cameraOrbit">
            <span>Orbita</span>
            <span class="range-control">
              <input id="cameraOrbit" type="range" min="0" max="360" step="1" value="178" />
              <output id="cameraOrbitValue" for="cameraOrbit">178</output>
            </span>
          </label>
          <label class="control-field range-field" for="cameraOffsetX">
            <span>Camera X</span>
            <span class="range-control">
              <input id="cameraOffsetX" type="range" min="-20" max="20" step="0.1" value="0" />
              <output id="cameraOffsetXValue" for="cameraOffsetX">0.0</output>
            </span>
          </label>
          <label class="control-field range-field" for="cameraOffsetY">
            <span>Camera Y</span>
            <span class="range-control">
              <input id="cameraOffsetY" type="range" min="-20" max="20" step="0.1" value="0" />
              <output id="cameraOffsetYValue" for="cameraOffsetY">0.0</output>
            </span>
          </label>
          <label class="control-field range-field" for="cameraOffsetZ">
            <span>Camera Z</span>
            <span class="range-control">
              <input id="cameraOffsetZ" type="range" min="-20" max="20" step="0.1" value="0" />
              <output id="cameraOffsetZValue" for="cameraOffsetZ">0.0</output>
            </span>
          </label>
          <button class="camera-copy-button" id="copyCameraButton" type="button">Copiar informacoes</button>
        </aside>
      </div>

      <main class="phone-shell" aria-label="Rank mobile 3D model viewer">
        <div class="hud" aria-hidden="true">
          <div class="health-hud hud-panel" data-health-hud>
            <span class="health-hud__icon">♥</span>
            <span class="health-hud__track">
              <span class="health-hud__fill" data-health-bar-fill></span>
            </span>
          </div>
          <div class="hud-right">
            <div class="weapon-slot-hud" data-weapon-slot-hud>
              <span class="weapon-slot is-unlocked is-active" data-combat-weapon-slot="pew" aria-label="Pistol slot 1">
                <span class="weapon-slot__key">1</span>
                <span class="weapon-slot__icon weapon-slot__icon--pistol" aria-hidden="true"></span>
              </span>
              <span class="weapon-slot" data-combat-weapon-slot="shotgun" aria-label="Shotgun slot 2">
                <span class="weapon-slot__key">2</span>
                <span class="weapon-slot__icon weapon-slot__icon--shotgun" aria-hidden="true"></span>
              </span>
            </div>
            <div class="ammo-hud hud-panel is-weapon-pistol" data-ammo-hud>
              <span class="ammo-hud__icon" aria-hidden="true"></span>
              <span class="ammo-hud__count" data-ammo-count>20</span>
              <span class="ammo-hud__pickup" data-ammo-pickup-toast hidden>+10</span>
            </div>
          </div>
        </div>
        <button class="options-gear-button" data-options-open="game" type="button" aria-label="Options">⚙</button>
        <div class="run-timer" data-run-timer hidden>00:00:00</div>
        <div class="scene" data-scene></div>
        <div class="crosshair" data-crosshair aria-hidden="true">
          <span class="crosshair__arm crosshair__arm--top"></span>
          <span class="crosshair__arm crosshair__arm--right"></span>
          <span class="crosshair__arm crosshair__arm--bottom"></span>
          <span class="crosshair__arm crosshair__arm--left"></span>
          <span class="crosshair__dot"></span>
        </div>
        <div class="mobile-joystick" data-mobile-joystick aria-hidden="true">
          <span class="mobile-joystick__base"></span>
          <span class="mobile-joystick__stick" data-mobile-joystick-stick></span>
        </div>
        <button class="mobile-fire-button" data-mobile-fire-button type="button" aria-label="Atirar"></button>
        <button class="corpse-search-button" data-corpse-search-button type="button" hidden>
          <span class="corpse-search-button__key">E</span>
          <span class="corpse-search-button__label">Vasculhar</span>
        </button>
        <div class="damage-flash" data-damage-flash aria-hidden="true"></div>
        <div class="stage-banner" data-stage-banner hidden></div>
        <div class="status" id="status" role="status">
          <span class="status__text" id="statusText">Carregando modelo...</span>
        </div>
        <div
          class="run-summary-modal"
          data-run-summary-modal
          role="dialog"
          aria-modal="true"
          aria-labelledby="runSummaryTitle"
          hidden
        >
          <section class="run-summary-card" aria-label="Resumo da run">
            <h2 class="run-summary-title" id="runSummaryTitle" data-run-summary-title>Você morreu</h2>
            <div class="run-summary-body" data-run-summary-body></div>
            <div class="run-summary-actions">
              <button class="run-summary-button" data-restart-run-button type="button">Reiniciar</button>
              <button class="run-summary-button run-summary-button--secondary" data-exit-run-button type="button">Sair</button>
            </div>
          </section>
        </div>
      </main>

      <div class="dev-side-stack dev-side-stack--right">
        <aside
          class="dev-panel dev-panel--right dev-tab-panel"
          id="devPanelMovement"
          role="tabpanel"
          aria-labelledby="devTabMovement"
          data-dev-panel="movement"
          aria-label="Movimento e arma"
          hidden
        >
          <div class="panel-heading">
            <span>Movimento e arma</span>
            <small>Dev</small>
          </div>
          <section class="rank-panel" aria-label="Controles do Rank">
            <label class="control-field" for="movementSelect">
              <span>Movimento</span>
              <select id="movementSelect" disabled></select>
            </label>
            <p class="movement-status" id="movementStatus" aria-live="polite">Carregando</p>
            <label class="control-field" for="weaponSelect">
              <span>Arma</span>
              <select id="weaponSelect" disabled></select>
            </label>
            <label class="control-field range-field" for="offsetX">
              <span>Horizontal</span>
              <span class="range-control">
                <input id="offsetX" type="range" min="-0.5" max="0.5" step="0.005" disabled />
                <output id="offsetXValue" for="offsetX">0.000</output>
              </span>
            </label>
            <label class="control-field range-field" for="offsetY">
              <span>Vertical</span>
              <span class="range-control">
                <input id="offsetY" type="range" min="-0.5" max="0.5" step="0.005" disabled />
                <output id="offsetYValue" for="offsetY">0.000</output>
              </span>
            </label>
            <label class="control-field range-field" for="offsetZ">
              <span>Lateral Z</span>
              <span class="range-control">
                <input id="offsetZ" type="range" min="-0.5" max="0.5" step="0.005" disabled />
                <output id="offsetZValue" for="offsetZ">0.000</output>
              </span>
            </label>
            <label class="control-field range-field" for="weaponScale">
              <span>Tamanho</span>
              <span class="range-control">
                <input id="weaponScale" type="range" min="0.1" max="8" step="0.05" disabled />
                <output id="weaponScaleValue" for="weaponScale">1.00</output>
              </span>
            </label>
            <div class="copy-row">
              <button id="copyInfoButton" type="button" disabled>Copiar informacoes</button>
              <p class="weapon-status" id="weaponStatus" aria-live="polite">Arma: carregando</p>
            </div>
          </section>
        </aside>

        <aside
          class="dev-panel dev-panel--right dev-tab-panel"
          id="devPanelColors"
          role="tabpanel"
          aria-labelledby="devTabColors"
          data-dev-panel="colors"
          aria-label="Cores do Rank"
          hidden
        >
          <div class="panel-heading">
            <span>Cores do Rank</span>
            <small id="colorStatus" aria-live="polite">Aguardando</small>
          </div>
          <section class="color-panel" id="colorPanel" aria-label="Paleta do Rank"></section>
          <div class="color-actions">
            <button id="resetColorsButton" type="button">Resetar</button>
            <button id="copyColorsButton" type="button">Copiar paleta</button>
          </div>
        </aside>

        <aside
          class="dev-panel dev-panel--right dev-tab-panel"
          id="devPanelTuning"
          role="tabpanel"
          aria-labelledby="devTabTuning"
          data-dev-panel="tuning"
          aria-label="Ajustes visuais"
          hidden
        >
          <div class="panel-heading">
            <span>Ajustes</span>
            <small id="visualTuningStatus" aria-live="polite">Padrao</small>
          </div>
          <section class="rank-panel visual-tuning-panel" aria-label="Ajustes visuais do jogo">
            <label class="control-field range-field" for="visualExposure">
              <span>Exposicao</span>
              <span class="range-control">
                <input id="visualExposure" type="range" min="0.4" max="2" step="0.05" value="1.45" />
                <output id="visualExposureValue" for="visualExposure">1.45</output>
              </span>
            </label>
            <label class="control-field range-field" for="visualAmbientLight">
              <span>Luz ambiente</span>
              <span class="range-control">
                <input id="visualAmbientLight" type="range" min="0" max="3" step="0.05" value="2.65" />
                <output id="visualAmbientLightValue" for="visualAmbientLight">2.65</output>
              </span>
            </label>
            <label class="control-field range-field" for="visualDirectLight">
              <span>Luz direta</span>
              <span class="range-control">
                <input id="visualDirectLight" type="range" min="0" max="4" step="0.05" value="0.25" />
                <output id="visualDirectLightValue" for="visualDirectLight">0.25</output>
              </span>
            </label>
            <label class="control-field range-field" for="visualLightDirection">
              <span>Direcao da luz</span>
              <span class="range-control">
                <input id="visualLightDirection" type="range" min="0" max="360" step="1" value="0" />
                <output id="visualLightDirectionValue" for="visualLightDirection">0deg</output>
              </span>
            </label>
            <label class="control-field range-field" for="visualFog">
              <span>Nevoa</span>
              <span class="range-control">
                <input id="visualFog" type="range" min="0" max="0.05" step="0.001" value="0.014" />
                <output id="visualFogValue" for="visualFog">0.014</output>
              </span>
            </label>
            <label class="toggle-row" for="collisionDebug">
              <span>Ver colisoes</span>
              <span class="toggle-control">
                <input id="collisionDebug" type="checkbox" />
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-value" id="collisionDebugValue">Nao</span>
              </span>
            </label>
            <button class="camera-copy-button" id="copyVisualTuningButton" type="button">Copiar infos</button>
          </section>
        </aside>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
